name: Sync GitHub to Gitee (Force Overwrite, No History)

on:
  push:
    branches: [ beta ]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 拉取全部历史（后续会丢弃）

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GITEE_RSA_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan gitee.com >> ~/.ssh/known_hosts

      - name: Create orphan branch with current files
        run: |
          # 设置 Git 用户身份（必须）
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # 创建无历史分支
          git checkout --orphan temp-branch
          git add -A
          git commit -m "Snapshot from GitHub $(date)"

      - name: Force push to Gitee (replace everything)
        run: |
          # 强制推送 temp-branch 到 Gitee 的 beta 分支
          git push -f git@gitee.com:shakespeach/i-craneplan-staticfiles-beta.git temp-branch:beta
          # 可选：清理 Gitee 上的其他分支/标签（请根据实际情况调整）
          # git push -f git@gitee.com:shakespeach/i-craneplan-staticfiles-beta.git --delete refs/heads/other-branch 2>/dev/null || true

      - name: Clean up
        run: rm -rf ~/.ssh/id_rsa