name: Sync GitHub to Gitee  # 工作流名称

# 触发条件：当代码推送到 GitHub 的 main 分支时触发
on:
  push:
    branches: [ beta ]  # 可修改为你的默认分支，如 master

# 工作流任务
jobs:
  sync:
    runs-on: ubuntu-latest  # 运行环境（Ubuntu 系统）
    steps:
      # 步骤1：拉取 GitHub 仓库代码
      - name: Checkout GitHub code
        uses: actions/checkout@v4  # 使用官方的代码拉取动作
        with:
          fetch-depth: 0  # 拉取所有历史记录，避免缺失提交
      
      # 步骤2：将代码同步到 Gitee（使用 HTTPS + 令牌）
      - name: Sync to Gitee
        uses: wearerequired/git-mirror-action@v1
        env:
          # 用于 GitHub 源仓库的 SSH 私钥（必须能访问 GitHub）
          SSH_PRIVATE_KEY: ${{ secrets.GITEE_RSA_PRIVATE_KEY }}
          # 用于 Gitee 目标仓库的 HTTPS 认证
          GIT_USERNAME: shakespeach
          GIT_PASSWORD: ${{ secrets.GITEE_TOKEN }}
          GIT_HTTP_POST_BUFFER: 524288000  # 可选：大仓库增大缓冲区
        with:
          # 源仓库（GitHub）地址保持 SSH 格式
          source-repo: git@github.com:zoomlion-shakespeach/i-craneplan-staticfiles.git
          # 目标仓库（Gitee）地址改为 HTTPS 格式
          destination-repo: https://gitee.com/shakespeach/i-craneplan-staticfiles.git
